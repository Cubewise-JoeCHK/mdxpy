[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mdxpy"
version = "1.3.2"  # Updated from setup.py
description = "A simple, yet elegant MDX library for TM1"
readme = {file = "readme.md", content-type = "text/markdown"}
requires-python = ">=3.5"
license = "MIT"  # Changed from table to SPDX string
keywords = ["MDX", "TM1", "IBM Cognos TM1", "Planning Analytics", "PA", "Cognos"]
authors = [
  {name = "Marius Wirtz", email = "MWirtz@cubewise.com"}
]
maintainers = [
  {name = "Marius Wirtz", email = "MWirtz@cubewise.com"}
]
classifiers = [
    'Intended Audience :: Developers',
    'Programming Language :: Python',
    'Programming Language :: Python :: 3',
    'Programming Language :: Python :: 3.5',
    'Programming Language :: Python :: 3.6',
    'Programming Language :: Python :: 3.7',
    'Programming Language :: Python :: 3.8',
    'Programming Language :: Python :: 3.9',
    'Programming Language :: Python :: 3.10',
    'Programming Language :: Python :: 3.11',
    'Programming Language :: Python :: Implementation :: CPython'
]
dependencies = []

[project.urls]
Homepage = "https://github.com/cubewise-code/mdxpy"

[project.optional-dependencies]
mdx-compiler = ["lark", "TM1py"]
test = ["pytest"]

[tool.setuptools]
packages = ["mdxpy"]
